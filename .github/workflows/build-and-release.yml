name: Build, Verify & Release Overnode macOS (Apple Silicon)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version de release personnalisée (optionnel, ex: 1.2.0)'
        required: false
      create_release:
        description: 'Créer une release GitHub officielle'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  validate-and-build:
    name: Verify Apple Silicon & Build App
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Unique Release Version & Tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            TAG="v$VERSION"
          else
            # Chaque commit sur main génère une version unique non conflictuelle : v1.1.<run_number>
            VERSION="1.1.${{ github.run_number }}"
            TAG="v$VERSION"
          fi
          echo "==> Version unique résolue : $VERSION (Tag: $TAG)"
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $GITHUB_ENV

      - name: Select Xcode Version
        run: |
          ls -d /Applications/Xcode* 2>/dev/null || true
          XCODE_16=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | tail -n 1)
          if [ -n "$XCODE_16" ]; then
            sudo xcode-select -s "$XCODE_16/Contents/Developer"
          fi
          swift --version

      - name: Clean Extended Attributes & Caches
        run: |
          echo "==> Cleaning macOS extended attributes & detritus..."
          xattr -cr app/Sources app/Tests 2>/dev/null || true

      - name: Run Swift Tests
        run: |
          echo "==> Running Overnode test suite..."
          cd app
          swift test

      - name: Pre-compile & Verify Apple Silicon (arm64) Compatibility
        run: |
          echo "==> Pre-compiling Overnode for Apple Silicon..."
          cd app
          swift build -c release

          BINARY_PATH=".build/release/Overnode"
          echo "==> Verifying binary architecture..."
          ARCH_INFO=$(file "$BINARY_PATH")
          echo "Binary details: $ARCH_INFO"
          if [[ "$ARCH_INFO" != *"arm64"* ]]; then
            echo "::error::Binary is not compiled for arm64 (Apple Silicon)!"
            exit 1
          fi
          echo "✓ Verified: Native Apple Silicon (arm64) executable."

          echo "==> Verifying minimum macOS compatibility..."
          grep -q "macOS(.v14)" Package.swift || grep -q "14.0" widget-Info.plist
          echo "✓ Verified: Compatible with macOS 14+ on Apple Silicon (M1, M2, M3, M4)."

      - name: Setup Apple Signing Keychain (app@overnode.fr)
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          INPUT_KEYCHAIN_PWD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PWD="${INPUT_KEYCHAIN_PWD:-overnode-temporary-keychain-2026}"
          if [ -n "$APPLE_CERT_BASE64" ]; then
            echo "==> Setting up Apple Developer ID certificate for app@overnode.fr..."
            KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
            security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"

            CERT_PATH=$RUNNER_TEMP/certificate.p12
            echo "$APPLE_CERT_BASE64" | base64 --decode > "$CERT_PATH"

            security import "$CERT_PATH" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
            security list-keychain-db -d user -s "$KEYCHAIN_PATH"
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN_PATH"
            echo "✓ Keychain successfully prepared for code signing."
          else
            echo "ℹ No Apple signing secret provided; signing with local ad-hoc identity."
          fi

      - name: Build Application Bundle & Sign
        env:
          CUSTOM_SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
        run: |
          SIGNING_IDENTITY="${CUSTOM_SIGNING_IDENTITY:-Developer ID Application: Overnode (app@overnode.fr)}"
          echo "==> Generating production Overnode.app bundle for v${{ env.RELEASE_VERSION }}..."
          cd app
          ./build_app.sh "${{ env.RELEASE_VERSION }}"

          APP_PATH="build/Overnode.app"
          
          # Check if Apple certificate identity is available in keychain
          if security find-identity -v -p codesigning | grep -q "app@overnode.fr"; then
            echo "==> Signing bundle with Apple ID identity ($SIGNING_IDENTITY)..."
            codesign --force --deep --options runtime --sign "$SIGNING_IDENTITY" "$APP_PATH"
          else
            echo "==> Signing with ad-hoc identity for general distribution..."
            codesign --force --deep --sign - "$APP_PATH"
          fi

          echo "==> Verifying signature integrity..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose "$APP_PATH" || true
          echo "✓ Bundle successfully signed and verified."

      - name: Package Release Archive (.dmg & .zip) & Compute Checksums
        run: |
          VERSION="${{ env.RELEASE_VERSION }}"
          echo "==> Packaging version: v$VERSION"
          cd app/build
          
          # 1. Create ZIP archive
          ZIP_NAME="Overnode-v${VERSION}-macOS-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "Overnode.app" "$ZIP_NAME"

          # 2. Create DMG Disk Image with Applications symlink
          DMG_NAME="Overnode-v${VERSION}-macOS-arm64.dmg"
          DMG_STAGING="dmg_staging"
          rm -rf "$DMG_STAGING" "$DMG_NAME"
          mkdir -p "$DMG_STAGING"
          cp -R "Overnode.app" "$DMG_STAGING/"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "Overnode" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG_NAME"
          rm -rf "$DMG_STAGING"

          # 3. Compute Checksums
          shasum -a 256 "$ZIP_NAME" > "checksums.sha256"
          shasum -a 256 "$DMG_NAME" >> "checksums.sha256"
          cat "checksums.sha256"

          echo "ZIP_PATH=app/build/$ZIP_NAME" >> $GITHUB_ENV
          echo "DMG_PATH=app/build/$DMG_NAME" >> $GITHUB_ENV
          echo "CHECKSUM_PATH=app/build/checksums.sha256" >> $GITHUB_ENV

      - name: Upload Artifacts (.dmg, .zip & checksums)
        uses: actions/upload-artifact@v4
        with:
          name: Overnode-v${{ env.RELEASE_VERSION }}-macOS-arm64
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
            ${{ env.CHECKSUM_PATH }}

      - name: Create Unique GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Overnode ${{ env.RELEASE_TAG }} (Apple Silicon)
          body: |
            ### Mise à jour Overnode ${{ env.RELEASE_TAG }}
            - **Version :** ${{ env.RELEASE_VERSION }}
            - **Commit :** ${{ github.sha }}
            - **Auteur :** ${{ github.actor }}
            - **Compatibilité :** macOS 14+ sur Apple Silicon (M1/M2/M3/M4)
            - **Signature Apple :** app@overnode.fr
            - **Formats :** Image disque (.dmg) et Archive (.zip)
          files: |
            ${{ env.ZIP_PATH }}
            ${{ env.DMG_PATH }}
            ${{ env.CHECKSUM_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
